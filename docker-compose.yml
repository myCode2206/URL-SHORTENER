# Local infrastructure. Phase 12 adds the API and nginx to this file.
# Credentials come from .env (see .env.example); nothing secret is written here.
name: url-shortener

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Bound to localhost only, so the database isn't reachable from your network.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # --requirepass: never run Redis without a password, even locally.
    # --maxmemory 256mb: a cache must have a ceiling; at the limit Redis
    #   evicts instead of growing until the machine runs out of memory.
    # --maxmemory-policy volatile-lru: evict the least recently used key that
    #   has a TTL. Every cache entry has one, so only cache entries are evicted.
    #   Data stored without a TTL (the click queue in Phase 9) is never evicted.
    # Run through sh so the password is read from the container environment
    # (compose doesn't pass `command` through a shell).
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --requirepass "$$REDIS_PASSWORD"
        --maxmemory 256mb
        --maxmemory-policy volatile-lru
        --save '' --appendonly no
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
